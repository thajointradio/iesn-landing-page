<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 678 200" width="678" height="200">
  <defs>
    <linearGradient id="igGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f09433"/>
      <stop offset="25%" style="stop-color:#e6683c"/>
      <stop offset="50%" style="stop-color:#dc2743"/>
      <stop offset="75%" style="stop-color:#cc2366"/>
      <stop offset="100%" style="stop-color:#bc1888"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#002d56"/>
      <stop offset="100%" style="stop-color:#003d72"/>
    </linearGradient>
  </defs>

  <!-- White background -->
  <rect width="678" height="200" fill="#ffffff"/>

  <!-- Left icon block -->
  <rect x="0" y="0" width="200" height="200" fill="url(#navyGrad)"/>

  <!-- Instagram icon (rounded square) -->
  <rect x="62" y="52" width="76" height="76" rx="18" fill="none" stroke="url(#igGrad)" stroke-width="7"/>
  <!-- Camera lens -->
  <circle cx="100" cy="90" r="20" fill="none" stroke="url(#igGrad)" stroke-width="6"/>
  <!-- Lens center -->
  <circle cx="100" cy="90" r="7" fill="url(#igGrad)"/>
  <!-- Dot top right -->
  <circle cx="128" cy="62" r="5" fill="url(#igGrad)"/>

  <!-- Vertical divider -->
  <rect x="200" y="20" width="3" height="160" fill="#002d56" rx="1.5"/>

  <!-- Right side: SOCIAL label -->
  <text x="228" y="80" font-family="Arial Black, Arial, sans-serif" font-size="48" font-weight="900" fill="#002d56" letter-spacing="-1">SOCIAL</text>

  <!-- Gold rule -->
  <rect x="228" y="92" width="418" height="4" fill="url(#igGrad)" rx="2"/>

  <!-- & DIGITAL -->
  <text x="230" y="148" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#597b9e" letter-spacing="4">&#38; DIGITAL</text>

  <!-- Stats line -->
  <text x="230" y="178" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#8faabf" letter-spacing="1">911K+ MONTHLY VIEWS  ·  113K+ ACCOUNTS REACHED</text>
</svg>
